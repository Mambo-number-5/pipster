services:
  redis:
    # Cambiamo l'immagine per includere i moduli RedisJSON e RedisSearch
    image: redis/redis-stack-server:latest
    container_name: pipster_redis
    #command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck: # Aggiunta: controlla se Redis è davvero pronto
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingestion:
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    image: pipster
    container_name: pipster_ingestion
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - ./data/historical_data:/app/data/historical_data
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
      - HOME=/tmp
    command: python bitget_ingestion.py
    restart: unless-stopped
  bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    image: pipster
    container_name: pipster_bot
    depends_on:
      redis:
        condition: service_healthy # Il bot parte solo quando il ping di redis risponde
    volumes:
      - .:/app
      - ./data/historical_data:/app/data/historical_data
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYDEVD_DISABLE_FILE_VALIDATION=1  # Toglie il warning del debugger
      - PYTHONUNBUFFERED=1                # Log in tempo reale, vedi i print mano a mano che compaiono
      - HOME=/tmp
    command: python main.py
    restart: unless-stopped

volumes:
  redis_data:
